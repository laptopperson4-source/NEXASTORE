<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Error · NexaStore</title>
  <link rel="icon" type="image/png" href="/branding/nexapulse-favicon-32.png" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>*{box-sizing:border-box;margin:0;padding:0}body{min-height:100vh;font-family:Inter,system-ui,sans-serif;background:#faf8f5;color:#1e2433;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 20px 48px}.wrap{width:100%;max-width:420px;text-align:center}.logo-ring{width:32px;height:32px;border:1.75px solid #1e2433;border-radius:50%;margin:0 auto 10px}.brand{font-size:13px;font-weight:600;color:#6b7280;margin-bottom:12px}.code{font-size:clamp(2.75rem,10vw,3.5rem);font-weight:800;letter-spacing:-.04em;color:#1e2433;line-height:1.1}h1{font-size:1.25rem;font-weight:700;margin:12px 0 8px;color:#1e2433}.msg{font-size:.9rem;color:#6b7280;line-height:1.55;margin:0 auto 8px;max-width:34ch}.art{margin:28px auto 32px;width:min(100%,300px)}.art svg{width:100%;height:auto;display:block}.btn{display:inline-flex;align-items:center;justify-content:center;min-width:180px;padding:12px 22px;border-radius:999px;border:1.75px solid #1e2433;background:#f3f1ed;color:#1e2433;font-weight:600;font-size:14px;text-decoration:none}.btn:hover{background:#e8e4dc}.support{display:block;margin-top:16px;font-size:12px;font-weight:500;color:#6b7280;text-decoration:none}.support:hover{color:#1e2433}</style>
</head>
<body>
  <div class="wrap">
    <div class="logo-ring" aria-hidden="true"></div>
    <p class="brand">NexaStore</p>
    <p class="code">!</p>
    <h1>Unexpected error</h1>
    <p class="msg">Something we didn’t plan for. Report it if it keeps happening, or go back to the store.</p>
    <div class="art"><svg viewBox="0 0 200 180" fill="none" xmlns="http://www.w3.org/2000/svg" stroke="#1e2433" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  <path d="M100 20 L180 160 L20 160 Z"/><path d="M100 55 V115"/><circle cx="100" cy="134" r="6"/>
</svg></div>
    <a class="btn" href="/">Go home</a>
    <a class="support" href="mailto:help@nexapulse.pro">Contact support</a>
  </div>
</body>
</html>
